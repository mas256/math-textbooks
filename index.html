<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="description" content="公開中の数学教科書やその他の著作物を探せる本棚です。">
  <title>数学書の本棚 — 数学教科書カタログ</title>
  <link rel="stylesheet" href="styles.css?v=publications">
  <script src="app.js?v=publications" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="数学書の本棚 トップ">
      <span class="brand-mark" aria-hidden="true">∫</span>
      <span>数学書の本棚</span>
    </a>

  </header>

  <main>
    <section class="product-banner" aria-labelledby="equashare-title">
      <div class="product-copy">
        <p class="eyebrow">EQUATION SHARING APP</p>
        <h1 id="equashare-title">Equashare <span>v5.0.2</span></h1>
        <p>LaTeXの数式を手軽に画像へ変換して共有できます。</p>
      </div>
      <div class="product-actions">
        <a class="product-download" href="https://github.com/mas256/Equashare/releases/download/v5.0.2/Equashare_5.0.2_x64-setup.exe" download="Equashare_5.0.2_x64-setup.exe">Windows版をダウンロード <span aria-hidden="true">↓</span></a>
        <a class="product-web" href="./equashare/" target="_blank" rel="noopener noreferrer">Web版を開く <span aria-hidden="true">↗</span></a>
        <a class="product-web" href="https://github.com/mas256/Equashare" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="product-banner recurrence-banner" aria-labelledby="recurrence-title">
      <div class="product-copy">
        <p class="eyebrow">RECURRENCE LAB</p>
        <h2 id="recurrence-title">漸化式の問題生成</h2>
        <p>難易度を選んで演習。ヒント・解答・別解で、式のつながりを学べます。</p>
      </div>
      <div class="product-actions">
        <a class="product-download" href="./recurrence/">問題をつくる <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="catalog" id="books" aria-labelledby="catalog-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow section-eyebrow">THE COLLECTION</p>
          <h2 id="catalog-title">公開中の教科書</h2>
        </div>
        <p class="catalog-count" id="catalog-count" aria-live="polite">読み込み中…</p>
      </div>

      <div class="book-grid" id="book-grid" aria-live="polite" aria-busy="true"></div>
      <p class="load-error" id="load-error" hidden>一覧を読み込めませんでした。時間をおいて再読み込みしてください。</p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand footer-brand" href="./"><span class="brand-mark" aria-hidden="true">∫</span><span>数学書の本棚</span></a>
    <span>数学を、自分のペースで。</span>
    <a href="https://github.com/mas256/math-textbooks">サイトのRepository</a>
  </footer>
</body>
</html>
