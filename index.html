<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <meta name="description" content="公開中の数学教科書やその他の著作物を探せる本棚です。">
  <title>数学書の本棚 — 数学教科書カタログ</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="数学書の本棚 トップ">
      <span class="brand-mark" aria-hidden="true">∫</span>
      <span>数学書の本棚</span>
    </a>

  </header>

  <main>
    <section class="catalog" id="books" aria-labelledby="catalog-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow section-eyebrow">THE COLLECTION</p>
          <h2 id="catalog-title">公開中の教科書</h2>
        </div>
        <p class="catalog-count" id="catalog-count" aria-live="polite">読み込み中…</p>
      </div>

      <div class="book-grid" id="book-grid" aria-live="polite" aria-busy="true"></div>
      <p class="load-error" id="load-error" hidden>一覧を読み込めませんでした。時間をおいて再読み込みしてください。</p>
    </section>

    <section class="catalog other-works" id="other-works" aria-labelledby="other-works-title">
      <div class="section-heading">
        <div>
          <h2 id="other-works-title">その他の公開中の著作物</h2>
        </div>
      </div>
      <div class="book-grid">
        <article class="book-card">
          <div class="card-top" aria-hidden="true"></div>
          <h3>Equashare</h3>
          <p class="description">数式を、つくって、画像にして、共有する。<br>数式を誰かに共有したいとき、数式ひとつのために大きなPDFを作る必要はありません。 このアプリは、LaTeXの数式を手軽に画像へ変換するための軽量な数式エディタです。</p>
          <div class="card-actions">
            <div class="card-action-group">
              <a class="card-primary" href="https://github.com/mas256/Equashare/releases/download/v5.0.2/Equashare_5.0.2_x64-setup.exe" download="Equashare_5.0.2_x64-setup.exe">インストーラ v5.0.2をダウンロード <span aria-hidden="true">↓</span></a>
              <a class="card-github" href="./equashare/" target="_blank" rel="noopener noreferrer" aria-label="Equashare Web版を開く">Web版を開く <span aria-hidden="true">↗</span></a>
            </div>
            <a class="card-github" href="https://github.com/mas256/Equashare" target="_blank" rel="noopener noreferrer" aria-label="EquashareのGitHubリポジトリ">GitHub <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand footer-brand" href="./"><span class="brand-mark" aria-hidden="true">∫</span><span>数学書の本棚</span></a>
    <span>数学を、自分のペースで。</span>
    <a href="https://github.com/mas256/math-textbooks">サイトのRepository</a>
  </footer>
</body>
</html>
