<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="数学書の本棚の教科書ページ。目次と版の履歴、PDFへのリンク。">
  <title>教科書 — 数学書の本棚</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("bookshelf:theme")==="light"?"light":"dark"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="shell.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="shell.js"></script>
  <script type="module" src="book.js"></script>
</head>
<body class="shell" data-page="book">
  <aside class="shell-sidebar" id="shell-sidebar" aria-label="サイドバー"></aside>

  <div class="shell-main">
    <header class="shell-topbar">
      <button type="button" class="shell-icon-button shell-menu-button" id="menu-toggle" aria-controls="shell-sidebar" aria-expanded="false" aria-label="メニュー">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="shell-crumbs" aria-label="現在地"><a href="./">教科書</a> <span aria-hidden="true">/</span> <span aria-current="page" id="crumb-title">…</span></nav>
      <button type="button" class="shell-icon-button" id="theme-toggle" aria-label="表示の明るさを切り替え"></button>
    </header>

    <main id="main" class="page">
      <div class="book-layout" id="book-layout">
        <div class="book-body">
          <div class="book-head">
            <p class="eyebrow book-category"><span class="shell-dot" id="book-dot" aria-hidden="true"></span><span id="book-category"></span></p>
            <h1 id="book-title">教科書</h1>
            <p class="description" id="book-description"></p>
            <p class="chips" id="book-chips"></p>
            <div class="button-row" id="read-actions">
              <a class="button button-accent" id="release-pdf" aria-disabled="true">PDFで読む</a>
            </div>
          </div>

          <div class="tabs" role="tablist" aria-label="本の情報">
            <button type="button" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="false" tabindex="-1">概要</button>
            <button type="button" role="tab" id="tab-toc" aria-controls="panel-toc" aria-selected="true">目次</button>
            <button type="button" role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1">版の履歴</button>
          </div>

          <section role="tabpanel" id="panel-about" aria-labelledby="tab-about" hidden></section>
          <section role="tabpanel" id="panel-toc" aria-labelledby="tab-toc">
            <p class="empty-note">目次を読み込んでいます…</p>
          </section>
          <section role="tabpanel" id="panel-history" aria-labelledby="tab-history" hidden></section>
        </div>

        <aside class="panel book-info" aria-label="版の情報">
          <dl>
            <dt>正式版</dt><dd id="release-version">確認中…</dd>
            <dt>公開</dt><dd id="release-date">—</dd>
            <dt>作成中</dt><dd id="latest-date">—</dd>
          </dl>
          <div class="info-links" id="info-links"></div>
        </aside>
      </div>
    </main>

    <footer class="shell-footer">
      <span>数学を、自分のペースで。</span>
      <span class="footer-links">
        <a href="https://github.com/mas256/math-textbooks" target="_blank" rel="noopener noreferrer">サイトのリポジトリ</a>
      </span>
    </footer>
  </div>
</body>
</html>
