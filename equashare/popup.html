<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <title>Equashare Quick</title>
  <script type="module" crossorigin src="./assets/popup-JdQfOaPZ.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/platform-DJevbYdu.js">
  <link rel="stylesheet" crossorigin href="./assets/platform-BIB-AAtT.css">
</head>
<body class="quick-popup-body">
  <div class="quick-popup">
    <div class="quick-popup-preview" id="quickPreview"></div>
    <textarea
      id="quickInput"
      class="quick-popup-input"
      data-i18n-placeholder="quickPopup.placeholder"
      placeholder="LaTeXを入力..."
      autofocus
      spellcheck="false"
    ></textarea>
    <div class="quick-popup-row">
      <span id="quickStatus" class="quick-popup-status" role="status" aria-live="polite"></span>
      <button id="quickCopyBtn" type="button" data-i18n="quickPopup.copy" data-i18n-title="quickPopup.copy.title">
        画像をコピー
      </button>
      <button id="quickOpenMainBtn" type="button" data-i18n="quickPopup.openMain">編集画面へ</button>
    </div>
  </div>
</body>
</html>
