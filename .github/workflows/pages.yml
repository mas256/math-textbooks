name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "books.json"
      - "equashare/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          books = json.loads(Path("books.json").read_text(encoding="utf-8"))
          assert isinstance(books, list) and books, "books.json must be a non-empty array"
          ids = set()
          required = ("title", "category", "description", "site", "repository", "releases")
          for book in books:
              for key in required:
                  assert isinstance(book.get(key), str) and book[key].strip(), f"missing {key}: {book}"
                  if key in {"site", "repository", "releases"}:
                      parsed = urlparse(book[key])
                      assert parsed.scheme == "https" and parsed.netloc, f"invalid {key}: {book[key]}"
              assert book["title"] not in ids, f"duplicate title: {book['title']}"
              ids.add(book["title"])
          print(f"Catalog validated: {len(books)} books")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p site/equashare
          cp index.html styles.css app.js books.json site/
          cp -a equashare/. site/equashare/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
