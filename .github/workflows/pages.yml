name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "books.json"
      - "equashare/**"
      - "recurrence/**"
      - ".github/workflows/recurrence-check.yml"
      - ".github/actions/verify-recurrence/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate and verify the recurrence bank
        uses: ./.github/actions/verify-recurrence

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          books = json.loads(Path("books.json").read_text(encoding="utf-8"))
          assert isinstance(books, list) and books, "books.json must be a non-empty array"
          ids = set()
          required = ("title", "category", "description", "site", "repository", "releases")
          for book in books:
              for key in required:
                  assert isinstance(book.get(key), str) and book[key].strip(), f"missing {key}: {book}"
                  if key in {"site", "repository", "releases"}:
                      parsed = urlparse(book[key])
                      assert parsed.scheme == "https" and parsed.netloc, f"invalid {key}: {book[key]}"
              assert book["title"] not in ids, f"duplicate title: {book['title']}"
              ids.add(book["title"])
          print(f"Catalog validated: {len(books)} books")
          PY

      - name: Assemble site
        run: |
          mkdir -p site/equashare site/recurrence/data
          cp index.html styles.css app.js books.json site/
          cp -a equashare/. site/equashare/
          cp recurrence/index.html recurrence/styles.css recurrence/app.js recurrence/model.mjs recurrence/mathjax-config.js site/recurrence/
          cp recurrence/build/problems.json recurrence/build/manifest.json site/recurrence/data/
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path("site/index.html")
          page = path.read_text(encoding="utf-8")
          page = re.sub(r'((?:src|href)="(?:app\.js|styles\.css))(?:\?[^"\s]*)?"',
                        lambda match: match[1] + "?v=" + os.environ["GITHUB_SHA"] + '"', page)
          path.write_text(page, encoding="utf-8")
          recurrence = Path("site/recurrence")
          index = recurrence / "index.html"
          text = index.read_text(encoding="utf-8")
          for name in ("styles.css", "app.js", "mathjax-config.js"):
              text = text.replace('"' + name + '"', '"' + name + '?v=' + os.environ["GITHUB_SHA"] + '"')
          index.write_text(text, encoding="utf-8")
          app = recurrence / "app.js"
          app.write_text(app.read_text(encoding="utf-8").replace("'./model.mjs'", "'./model.mjs?v=" + os.environ["GITHUB_SHA"] + "'"), encoding="utf-8")
          PY

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          reporting_interval: 1000
