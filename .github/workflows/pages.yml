name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "books.json"
      - "tests/**"
      - "equashare/**"
      - "recurrence/**"
      - ".github/workflows/recurrence-check.yml"
      - ".github/actions/verify-recurrence/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Called by recurrence-regenerate.yml to publish the bank commit it created.
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Job-level so that the called workflow shares the queue with push deploys.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Record the deployed revision
        run: echo "SITE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify the recurrence bank
        uses: ./.github/actions/verify-recurrence

      - name: Check catalog reading links
        run: NODE_PATH=/tmp/recurrence-browser/node_modules node tests/catalog-browser.cjs

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          books = json.loads(Path("books.json").read_text(encoding="utf-8"))
          assert isinstance(books, list) and books, "books.json must be a non-empty array"
          ids = set()
          required = ("title", "category", "description", "site", "repository", "releases")
          for book in books:
              for key in required:
                  assert isinstance(book.get(key), str) and book[key].strip(), f"missing {key}: {book}"
                  if key in {"site", "repository", "releases"}:
                      parsed = urlparse(book[key])
                      assert parsed.scheme == "https" and parsed.netloc, f"invalid {key}: {book[key]}"
              assert book["title"] not in ids, f"duplicate title: {book['title']}"
              ids.add(book["title"])
          print(f"Catalog validated: {len(books)} books")
          PY

      - name: Assemble site
        run: python3 recurrence/scripts/assemble-site.py

      - name: Check the assembled recurrence site
        run: |
          python3 -m http.server 8788 --directory site --bind 127.0.0.1 > /tmp/recurrence-site-http.log 2>&1 &
          RECURRENCE_BASE_URL=http://127.0.0.1:8788/recurrence/ NODE_PATH=/tmp/recurrence-browser/node_modules node recurrence/tests/site-browser.cjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          reporting_interval: 1000

      - name: Verify the published recurrence site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            if RECURRENCE_BASE_URL="${PAGES_URL%/}/recurrence/" RECURRENCE_EXPECT_SITE_REVISION="$SITE_REVISION" NODE_PATH=/tmp/recurrence-browser/node_modules node recurrence/tests/site-browser.cjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
