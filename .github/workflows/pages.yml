name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "books.json"
      - "tests/**"
      - "equashare/**"
      - "recurrence/**"
      - ".github/workflows/recurrence-check.yml"
      - ".github/actions/verify-recurrence/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate and verify the recurrence bank
        uses: ./.github/actions/verify-recurrence

      - name: Check catalog reading links
        run: NODE_PATH=/tmp/recurrence-browser/node_modules node tests/catalog-browser.cjs

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          books = json.loads(Path("books.json").read_text(encoding="utf-8"))
          assert isinstance(books, list) and books, "books.json must be a non-empty array"
          ids = set()
          required = ("title", "category", "description", "site", "repository", "releases")
          for book in books:
              for key in required:
                  assert isinstance(book.get(key), str) and book[key].strip(), f"missing {key}: {book}"
                  if key in {"site", "repository", "releases"}:
                      parsed = urlparse(book[key])
                      assert parsed.scheme == "https" and parsed.netloc, f"invalid {key}: {book[key]}"
              assert book["title"] not in ids, f"duplicate title: {book['title']}"
              ids.add(book["title"])
          print(f"Catalog validated: {len(books)} books")
          PY

      - name: Assemble site
        run: python3 recurrence/scripts/assemble-site.py

      - name: Check the assembled recurrence site
        run: |
          python3 -m http.server 8788 --directory site --bind 127.0.0.1 > /tmp/recurrence-site-http.log 2>&1 &
          RECURRENCE_LAB_BASE_URL=http://127.0.0.1:8788/recurrence/ NODE_PATH=/tmp/recurrence-browser/node_modules node recurrence/tests/lab-browser.cjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          reporting_interval: 1000
