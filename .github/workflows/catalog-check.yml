name: Check catalog reading links

on:
  pull_request:
    paths: ['index.html', 'app.js', 'styles.css', 'book.html', 'book.js', 'lib.js', 'shell.css', 'shell.js', 'sw.js', 'books.json', 'tests/**', 'recurrence/scripts/assemble-site.py', '.github/workflows/catalog-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --prefix /tmp/recurrence-browser --no-save --ignore-scripts playwright@1.55.1
          /tmp/recurrence-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the reading links
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/catalog-http.log 2>&1 &
          NODE_PATH=/tmp/recurrence-browser/node_modules node tests/catalog-browser.cjs
      - name: Check the assembled site
        run: |
          python3 recurrence/scripts/assemble-site.py
          python3 -m http.server 8788 --directory site --bind 127.0.0.1 > /tmp/site-http.log 2>&1 &
          sleep 1
          CATALOG_TEST_URL=http://127.0.0.1:8788/ NODE_PATH=/tmp/recurrence-browser/node_modules node tests/catalog-browser.cjs
