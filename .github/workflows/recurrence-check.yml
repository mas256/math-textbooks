name: Verify recurrence generator

on:
  workflow_call:
  push:
    branches: ['codex/recurrence-generator']
    paths: ['recurrence/**', '.github/actions/verify-recurrence/**', '.github/workflows/recurrence-check.yml']
  pull_request:
    paths: ['recurrence/**', '.github/actions/verify-recurrence/**', '.github/workflows/recurrence-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recurrence-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-recurrence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recurrence-verified
          path: recurrence/build/
